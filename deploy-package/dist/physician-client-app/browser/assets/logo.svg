<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer circle border -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="#D4AF37" stroke-width="2"/>
  
  <!-- Inner rounded square (calendar base) -->
  <rect x="25" y="28" width="50" height="45" rx="6" ry="6" fill="none" stroke="#D4AF37" stroke-width="2"/>
  
  <!-- Calendar header bar -->
  <rect x="25" y="28" width="50" height="12" rx="6" ry="6" fill="#D4AF37" opacity="0.2"/>
  
  <!-- Calendar dots (days) -->
  <circle cx="32" cy="35" r="1.5" fill="#D4AF37"/>
  <circle cx="42" cy="35" r="1.5" fill="#D4AF37"/>
  <circle cx="52" cy="35" r="1.5" fill="#D4AF37"/>
  <circle cx="68" cy="35" r="1.5" fill="#D4AF37"/>
  
  <!-- Checkmark inside calendar -->
  <path d="M 38 50 L 45 58 L 62 42" stroke="#D4AF37" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>